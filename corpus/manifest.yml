schema_version: 1

# Provenienza del testo. Le quattro cose che questo progetto tiene distinte:
#   1. l'opera originale di Simone Weil;
#   2. la trascrizione digitale della fonte (Wikisource);
#   3. la nuova traduzione italiana, ancora da realizzare;
#   4. il codice del progetto.
# Si veda LICENSE per i termini che valgono per ciascuna.

opera:
  titolo: L’Iliade ou le poème de la force
  titolo_it: L’Iliade, o il poema della forza
  autrice: Simone Weil
  lingua_originale: fr
  prima_pubblicazione:
    sede: Les Cahiers du Sud
    quando: dicembre 1940 e gennaio 1941
    nota: >-
      Pubblicato in due puntate, con lo pseudonimo Émile Novis, mentre Simone
      Weil si trovava a Marsiglia.

edizione_di_riferimento:
  titolo: La Source grecque
  editore: Gallimard
  luogo: Paris
  anno: 1953
  pagine: 11-42
  nota: >-
    Raccolta postuma in cui il saggio è stato ristampato; è l'edizione da cui
    dipende la trascrizione digitale usata qui. Non è l'edizione originale del
    saggio, che è quella dei «Cahiers du Sud» del 1940-1941.

trascrizione_digitale:
  nome: Wikisource francese
  stato: testo validato
  pagina: La Source grecque/01/L’Iliade, ou le poème de la force
  url: https://fr.wikisource.org/wiki/La_Source_grecque/01/L%E2%80%99Iliade,_ou_le_po%C3%A8me_de_la_force
  licenza: CC BY-SA 4.0
  nota: >-
    Il Markdown francese e la sua rappresentazione strutturata sono stati
    consegnati al progetto già derivati da questa trascrizione. Il progetto non
    interroga direttamente Wikisource: non c'è quindi un identificativo di
    revisione, e i dati qui sopra sono quelli dichiarati nel front matter del
    file francese.

traduzione_italiana:
  titolo: L’Iliade, o il poema della forza
  autori: GPT-5.6 Sol, con l'ausilio di Claude Opus 5.0
  # Stesso vocabolario del campo `stato_traduzione` nel front matter di
  # corpus/it/, che scripts/validate_corpus.py tiene allineato al file.
  stato: tradotto
  licenza: CC BY-SA 4.0
  criteri: >-
    Traduzione integrale e nuova, condotta sul francese; nessuna traduzione
    italiana preesistente è stata usata. Ortografia, lessico, punteggiatura e
    corsivi seguono il testo di partenza, senza modernizzazioni. Le citazioni
    omeriche sono tradotte dal francese e non dal greco, conservando gli a-capo
    verso per verso.
  glossario:
    malheur:
      politica: contestuale
      nota: >-
        Termine concettualmente marcato in Simone Weil, e centrale in questo
        saggio: va esaminato nel contesto, mai risolto con una sostituzione
        automatica.
  nota: >-
    `da_tradurre` finché in `corpus/it/` resta anche un solo segnaposto;
    `tradotto` quando non ne resta nessuno.

